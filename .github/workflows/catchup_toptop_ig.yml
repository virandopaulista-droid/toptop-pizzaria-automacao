name: Catchup IG TopTop (temp)

on:
  workflow_dispatch:

env:
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
      - name: Write .env
        run: |
          cat > .env <<EOF
          FB_PAGE_ACCESS_TOKEN="$FB_PAGE_ACCESS_TOKEN"
          FB_PAGE_ID="$FB_PAGE_ID"
          IG_BUSINESS_ID="$IG_BUSINESS_ID"
          EOF
      - name: Post 08-27 story to Instagram
        run: |
          bash scripts/post_story_video_instagram.sh "https://drive.google.com/uc?export=download&id=1QJz2ktT7D_wSCzM1y2qgNvoVYAFR8lsw"
      - name: Post 08-28 story_1 to Instagram
        run: |
          video_url=$(python3 scripts/resolve_drive_url.py "133.mp4")
          echo "URL: $video_url"
          bash scripts/post_story_video_instagram.sh "$video_url"
