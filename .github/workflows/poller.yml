name: Poller (stories)

on:
  schedule:
    # Every 15 min, 22-23 + 00 UTC (19:30-21:59 America/Sao_Paulo, no DST),
    # every day. Covers both the Mon-Thu single 20h slot and the Fri-Sun
    # 19:30+21:30 slots -- poller.py's own SCHEDULE + weekday filter decides
    # what actually fires. Wide + frequent on purpose: GitHub's cron does not
    # reliably fire at the configured time (see Bernardino's automation),
    # and poller.py does catch-up matching (fires on whatever tick lands
    # after a scheduled time, same day), so a wide window matters more here
    # than an exact one.
    - cron: "*/15 22,23,0 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Postar de verdade? (false = so testar o mount/ambiente, sem publicar)"
        type: boolean
        default: false
      force_slot:
        description: "(opcional, so p/ teste manual) forca postar agora, ignorando a janela de horario: story | story_1 | story_2"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

# Prevents two overlapping runs from both reading "not posted yet" and both
# posting for real before either saves state (same risk found and fixed on
# the Bernardino automation).
concurrency:
  group: toptop-poller
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fuse3

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone and mount Google Drive
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_SECRET" > ~/.config/rclone/rclone.conf
          echo "rclone.conf: $(wc -c < ~/.config/rclone/rclone.conf) bytes"
          echo "=== remotes configurados ==="
          rclone listremotes || echo "(rclone listremotes falhou, exit $?)"
          echo "=== teste direto de conexao (rclone about gdrive:) ==="
          rclone about gdrive: || echo "(rclone about falhou, exit $?)"
          mkdir -p "$HOME/gdrive"
          if ! rclone mount gdrive: "$HOME/gdrive" \
            --daemon --vfs-cache-mode=minimal --dir-cache-time=1h \
            --log-file="$HOME/rclone-mount.log" --log-level=INFO; then
            echo "##[error] comando 'rclone mount' retornou erro na hora (nao entrou em background)"
            echo "=== rclone mount log ==="
            cat "$HOME/rclone-mount.log" 2>/dev/null || echo "(sem log)"
            exit 1
          fi
          sleep 3
          echo "=== rclone mount log (apos 3s) ==="
          cat "$HOME/rclone-mount.log" 2>/dev/null || echo "(sem log)"
          rclone lsf gdrive: -R --dirs-only > "$HOME/all_dirs.txt"
          rel_path=$(grep -i "^Ag.ncia BEEF MTK/Clientes */TopTop Pizzaria */Storie/AGENTE - STORIES/$" "$HOME/all_dirs.txt" | head -1)
          if [ -z "$rel_path" ]; then
            echo "=== nao encontrado, mostrando entradas parecidas ==="
            grep -i "toptop\|agente" "$HOME/all_dirs.txt" | head -20
            echo "mount failed: pasta AGENTE - STORIES nao encontrada"
            exit 1
          fi
          agente_dir="$HOME/gdrive/${rel_path}"
          ready=""
          for i in $(seq 1 15); do
            if [ -d "$agente_dir" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "=== rclone mount log ==="
            cat "$HOME/rclone-mount.log" || true
            echo "mount failed: $agente_dir nao apareceu no mount"
            exit 1
          fi
          agente_dir="${agente_dir%/}"
          echo "AGENTE_STORIES_DIR=$agente_dir" >> "$GITHUB_ENV"

      - name: Write .env
        run: |
          cat > .env <<EOF
          FB_PAGE_ACCESS_TOKEN="$FB_PAGE_ACCESS_TOKEN"
          FB_PAGE_ID="$FB_PAGE_ID"
          IG_BUSINESS_ID="$IG_BUSINESS_ID"
          EOF
          cat .env | sed 's/^\(FB_PAGE_ACCESS_TOKEN\)=.*/\1=***/'

      - name: Run poller
        run: |
          extra_args=()
          if [ -n "${{ inputs.force_slot }}" ]; then
            extra_args+=(--force-slot "${{ inputs.force_slot }}")
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            python3 scripts/poller.py --live "${extra_args[@]}"
          else
            python3 scripts/poller.py "${extra_args[@]}"
          fi

      - name: Commit any state changes (used flags, posted log)
        if: always()
        run: |
          git config user.name "TopTop Automacao"
          git config user.email "virandopaulista@gmail.com"
          git add content/agente_stories_manifest.json content/posted_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nada para commitar"
            exit 0
          fi
          git commit -m "poller: atualiza estado (used/posted)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push ok (tentativa $attempt)"
              exit 0
            fi
            echo "push falhou, tentativa $attempt/5 -- rebase e tenta de novo"
            git fetch origin master
            git rebase origin/master || { git rebase --abort; git reset --soft origin/master; git stash pop 2>/dev/null || true; }
            sleep $((attempt * 3))
          done
          echo "##[error] NAO CONSEGUI SALVAR O ESTADO APOS 5 TENTATIVAS -- risco real de post duplicado na proxima execucao"
          exit 1

